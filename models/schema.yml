    columns:
      - name: HASH_KEY
        tests:
          - unique
          - not_null

  - name: stg_btc_outputs
    tests:
      - dbt_utils.equal_rowcount:
          compare_model: ref('st_btc_outputs_py')


  - name: whale_alert
    columns:
    - name: address
      data_tests:
        - assert_valid_btc_address

exposures:

  - name: btc_whale_alert_exposure
    label: BTC Whale alert
    type: dashboard
    maturity: high
    url: https://datastudio.google.com/reporting/27da8b89-6411-4f28-91ae-791f71e1d4b0
    description: >
      BTC Whale alert transactions report"?

    depends_on:
      - ref('whale_alert')

    owner:
      name: Bahar